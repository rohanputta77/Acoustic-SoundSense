services:
  - type: web
    name: soundsense
    env: docker
    plan: free
    dockerfilePath: ./deployment/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: RELOAD
        value: "false"
      - key: SOUNDSENSE_SECRET
        generateValue: true
